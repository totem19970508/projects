<!DOCTYPE html>
<html lang="en" data-application="reportGenerator">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspection Report Generator · ClearLED</title>
  <script>if(sessionStorage.getItem("clearled_authenticated")!=="true"&&localStorage.getItem("clearled_authenticated")!=="true")window.location.replace("index.html");</script>

  <style>
    :root {
      --gap: 18px;
      --pad: 14px;
      --page-bg: #fff;
      --text: #111;
      --muted: #666;
      --card-bg: #fff;
      --panel-bg: #fafafa;
      --border: #ddd;
      --accent: #168fc7;
    }

    body {
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
      font-size: 14px;
      color: var(--text);
      background: var(--page-bg);
      transition: color .2s, background .2s;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      color: #333;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 14px 0 22px;
    }

    .toolbar[hidden] {
      display: none !important;
    }

    button,
    .filebtn {
      padding: 7px 12px;
      border: 1px solid #999;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(to bottom, #f2f2f2, #d6d6d6);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .2), inset 0 1px 0 #fff;
      transition: all .15s ease-in-out;
    }

    button:hover,
    .filebtn:hover {
      background: linear-gradient(to bottom, #e9e9e9, #cfcfcf);
    }

    button:active,
    .filebtn:active {
      background: linear-gradient(to bottom, #d0d0d0, #b8b8b8);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .3);
      transform: translateY(1px);
    }

    button:disabled,
    .filebtn.disabled {
      color: #8a8a8a;
      background: #dedede;
      border-color: #c5c5c5;
      box-shadow: none;
      cursor: not-allowed;
      opacity: .62;
      transform: none;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-left: auto;
      align-self: center;
    }

    .header-actions button {
      white-space: nowrap;
    }

    .workspace-link {
      padding: 7px 12px;
      border: 1px solid #999;
      border-radius: 6px;
      color: inherit;
      background: linear-gradient(to bottom, #f2f2f2, #d6d6d6);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .2), inset 0 1px 0 #fff;
      text-decoration: none;
      white-space: nowrap;
    }

    .filebtn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
    }

    input[type="file"] {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .imgwrap {
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      cursor: pointer;
    }

    .card img,
    .card video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .cap {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      min-width: 20px;
      padding: 4px 7px;
      border-radius: 999px;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 0, 0, .72);
      text-align: center;
      line-height: 1;
    }

    textarea {
      /* Photo remarks input field: font size 14px; default field height 68px. */
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0 var(--pad);
      height: 68px;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 14px;
      padding: 7px;
      border: 1px solid #bbb;
      border-radius: 8px;
      resize: vertical;
      color: var(--text);
      background: var(--card-bg);
    }

    .hint {
      display: none;
    }

    .metadata {
      display: none;
    }

    .footer {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      align-items: center;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .proj {
      font-weight: 600;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #111;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      opacity: 0;
      transform: translateY(10px);
      transition: all .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .header .brand {
      height: 110px;
      width: auto;
      display: block;
    }

    .header .titles {
      display: flex;
      flex-direction: column;
      gap: 6px;
      line-height: 1.1;
      flex: 1;
      min-width: 220px;
    }

    .header-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 30px;
    }

    .header-field {
      width: min(700px, 100%);
      box-sizing: border-box;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      padding: 3px 6px;
      font-family: inherit;
    }

    .header-inline .field-with-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .header-inline .field-with-label select,
    .header-inline .field-with-label input {
      min-width: 120px;
      max-width: 180px;
      height: 28px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font: inherit;
    }

    #reportDate {
      width: 128px;
      min-width: 128px;
    }

    #reportDayOfWeek {
      min-width: 38px;
      font-weight: 700;
      color: var(--muted);
    }

    .header-field:hover,
    .header-field:focus {
      border-color: #aaa;
      background: var(--card-bg);
      outline: none;
    }

    .header-field {
      color: var(--text);
    }

    #reportTitle {
      font-size: 23px;
      font-weight: 700;
    }

    #reportDate,
    #createdBy {
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    #inspectionTitle {
      width: min(240px, 24vw);
      min-width: 160px;
      margin-left: auto;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
    }

    .media-count {
      margin: 0 0 14px;
      font-weight: 700;
      color: var(--text);
    }

    .report-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 100%;
      max-width: 960px;
      box-sizing: border-box;
      gap: 10px 12px;
      margin: 0 0 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-bg);
    }

    .detail-field {
      display: grid;
      grid-template-columns: 132px minmax(0, 320px);
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .detail-field input,
    .detail-field select,
    .detail-field textarea {
      width: min(100%, 320px);
      box-sizing: border-box;
      margin: 0;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      background: var(--card-bg);
      font: inherit;
      font-weight: 400;
    }

    .detail-field textarea {
      /* Main Remarks input field: font size 14px; default field height 46px. */
      height: 46px;
      resize: vertical;
    }

    .detail-field.full-width {
      grid-column: 1 / -1;
    }

    .report-crud {
      width: 100%;
      max-width: 960px;
      box-sizing: border-box;
      margin: 0 0 18px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-bg);
    }

    .crud-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .crud-toolbar input,
    .crud-toolbar select,
    .crud-toolbar button {
      height: 32px;
      border-radius: 6px;
      font: inherit;
    }

    .crud-toolbar input,
    .crud-toolbar select {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      padding: 0 8px;
      min-width: 150px;
    }

    .crud-toolbar #saveReportBtn.is-dirty {
      border-color: #218a4b;
      color: #ffffff;
      background: #239b56;
      box-shadow: 0 0 0 3px rgba(35, 155, 86, .18);
    }

    .crud-toolbar #saveReportBtn.is-dirty:hover {
      border-color: #176d39;
      background: #1c8148;
    }

    .crud-list {
      width: 100%;
      min-height: 70px;
      max-height: 180px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      padding: 6px;
    }

    .crud-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .crud-row:last-child {
      border-bottom: none;
    }

    .crud-row strong {
      display: inline-block;
      min-width: 120px;
    }

    .crud-row .meta {
      color: var(--muted);
      font-size: 12px;
    }

    .print-footer {
      display: none;
    }

    .print-photo-page,
    .print-photo-row {
      display: contents;
    }

    .print-page-header {
      display: none;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lightbox img,
    .lightbox video {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 0 20px #000;
    }

    .storage-panel {
      max-width: 900px;
      max-height: 80vh;
      overflow: auto;
      padding: 16px;
      border-radius: 10px;
      color: #111;
      background: #fff;
    }

    .storage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .storage-title {
      margin: 0;
      font-size: 18px;
    }

    .storage-actions {
      display: flex;
      gap: 8px;
    }

    .storage-output {
      padding: 12px;
      border-radius: 8px;
      background: #f7f7f7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .loading-message {
      padding: 10px;
      color: #777;
    }

    .card-video {
      border-radius: 12px;
    }

    @page {
      size: A4 landscape;
      /* The macOS PDF renderer ignores @page margins, so spacing is applied below. */
      margin: 0 0 12mm;

      @bottom-left {
        content: "Filename: " var(--print-file-name);
        padding-left: 10mm;
        font-size: 9pt;
      }

      @bottom-center {
        content: "Date: " var(--print-report-date);
        font-size: 9pt;
      }

      @bottom-right {
        content: "Page " counter(page) "/" counter(pages);
        padding-right: 10mm;
        font-size: 9pt;
      }
    }

    @media print {
      body { margin: 0; padding-bottom: 0; }
      .toolbar, .header-actions, .sub, .footer, .toast, .lightbox { display: none !important; }
      .header-field { border: 0; padding-left: 0; }
      /* PRINT CONTENT MARGINS — change these 30mm values to adjust the PDF spacing. */
      .header { margin-right: 10mm; margin-left: 10mm; }
      .report-details, .media-count { margin-right: 30mm; margin-left: 30mm; }
      body .report-details {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: auto;
        max-width: none;
        margin-top: 48mm;
        gap: 8px 14px;
        padding: 12px;
      }
      body .detail-field.full-width { grid-column: 1 / -1; }
      .grid {
        display: block;
        padding: 0;
      }
      .print-photo-page {
        display: block;
        break-before: page;
        page-break-before: always;
      }
      .print-page-header {
        display: flex;
        margin: 8mm 10mm 8mm;
      }
      .print-photo-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        box-sizing: border-box;
        padding-right: 10mm;
        padding-left: 10mm;
      }
      .card {
        margin-top: 0;
        margin-bottom: 0;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .card img,
      .card video { height: 370px; object-fit: cover; background: #f7f7f7; }
      .card textarea { height: 48px; border-color: #ccc; resize: none; }
      .print-footer { display: none; }
      body { --page-bg: #fff; --text: #111; --muted: #555; --card-bg: #fff; --panel-bg: #fafafa; --border: #ddd; }
    }

    @media screen and (max-width: 850px) {
      .report-details { grid-template-columns: 1fr; }
      .detail-field.full-width { grid-column: auto; }
    }

    @media screen and (max-width: 700px) {
      .header { align-items: flex-start; flex-wrap: wrap; }
      #inspectionTitle {
        flex: 1 0 calc(100% - 124px);
        width: calc(100% - 124px);
        margin-left: 124px;
        text-align: left;
      }
      .header-actions {
        flex-basis: 100%;
        margin-left: 124px;
      }
    }

    @media screen and (max-width: 520px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-field { grid-template-columns: 1fr; }
    }

    @media screen and (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>

  <style id="printMetadataStyle"></style>

  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
  <script type="module" src="access-guard.js"></script>
  <script type="module" src="report-master-data.js"></script>
</head>

<body>
  <div class="header">
    <img class="brand" src="company-logo.png" alt="ClearLED Logo" />
    <div class="titles">
      <input id="reportTitle" class="header-field" aria-label="Report title" />
      <div class="header-inline">
        <label class="field-with-label">
          <input id="reportDate" class="header-field" type="date" aria-label="Report date" />
          <span id="reportDayOfWeek">Mon</span>
        </label>
        <label class="field-with-label">
          <span>Create by:</span>
          <select id="createdBy" aria-label="Created by">
            <option value="">Select</option>
            <option value="A. Lee">A. Lee</option>
            <option value="M. Chen">M. Chen</option>
            <option value="R. Patel">R. Patel</option>
            <option value="S. Kumar">S. Kumar</option>
          </select>
        </label>
        <label class="field-with-label">
          <span>Prepare by:</span>
          <select id="preparedBy" aria-label="Prepared by">
            <option value="">Select</option>
            <option value="A. Lee">A. Lee</option>
            <option value="M. Chen">M. Chen</option>
            <option value="R. Patel">R. Patel</option>
            <option value="S. Kumar">S. Kumar</option>
          </select>
        </label>
      </div>
    </div>
    <input id="inspectionTitle" class="header-field" aria-label="Inspection report type" readonly />
    <div class="header-actions">
      <a class="workspace-link" href="applications.html">⌂ Home</a>
      <button onclick="window.print()">Print / Save PDF</button>
      <button id="signout-button" type="button">Sign out</button>
    </div>
  </div>

  <section class="report-details" aria-label="Report details">
    <label class="detail-field">Report No.:
      <input id="reportNo" type="text" placeholder="RPT-001" />
    </label>
    <label class="detail-field">Report by:
      <select id="reportBy" aria-label="Report by person">
        <option value="">Select person</option>
        <option value="Engineer">Engineer</option>
        <option value="QA Team">QA Team</option>
        <option value="Project Lead">Project Lead</option>
      </select>
    </label>
    <label class="detail-field">Prepare by:
      <select id="prepareBy" aria-label="Prepare by person">
        <option value="">Select person</option>
        <option value="Engineer">Engineer</option>
        <option value="QA Team">QA Team</option>
        <option value="Project Lead">Project Lead</option>
      </select>
    </label>
    <label class="detail-field">Factory Reference:
      <select id="factoryName" aria-label="Factory reference"><option value="">Loading factories…</option></select>
    </label>
    <label class="detail-field">Customer Name:
      <select id="customerName" aria-label="Customer name"><option value="">Loading customers…</option></select>
    </label>
    <label class="detail-field">Product Reference:
      <input id="productReference" type="text" />
    </label>
    <label class="detail-field">Product Detail:
      <textarea id="productDetail" rows="2" placeholder="Pixel size, Nits levels, Power"></textarea>
    </label>
    <label class="detail-field full-width">Remarks:
      <textarea id="reportRemarks"></textarea>
    </label>
  </section>

  <section class="report-crud" aria-label="Report management">
    <div class="crud-toolbar">
      <input id="reportSearch" type="search" placeholder="Search reports..." aria-label="Search reports" />
      <button id="newReportBtn" type="button">New</button>
      <button id="saveReportBtn" type="button">Save / Update</button>
      <button id="loadReportBtn" type="button">Read</button>
      <button id="deleteReportBtn" type="button">Delete</button>
    </div>
    <div id="reportList" class="crud-list" aria-live="polite"></div>
  </section>

  <div class="sub">
    Folder-scoped remarks. JSON can be saved into the chosen local folder. Optional override via <code>?project=250821</code>.
  </div>

  <!-- Preserved for future reuse: remove the hidden attribute to restore these controls. -->
  <div class="toolbar" hidden>
    <button onclick="saveRemarks()" disabled>Save Remarks</button>
    <button onclick="clearRemarks()" disabled>Clear Remarks (this folder)</button>
    <button onclick="chooseSaveFolder()" disabled>Choose Folder</button>
    <button onclick="saveJsonToFolder()" disabled>Save JSON to Folder</button>
    <button onclick="loadJsonFromFolder()" disabled>Load JSON from Folder</button>
    <button onclick="exportRemarks()" disabled>Export JSON</button>
    <label class="filebtn disabled" for="importFile" aria-disabled="true">
      Import JSON
      <input id="importFile" type="file" accept="application/json" disabled />
    </label>
    <button onclick="showStorage(false)" disabled>Show Storage (this folder)</button>
    <button onclick="showStorage(true)" disabled>Show Storage (all)</button>
  </div>

  <div id="mediaCount" class="media-count">Counting photos…</div>

  <div id="grid" class="grid"></div>

  <div class="footer">
    <div>Storage key prefix: <span class="proj" id="prefixLabel"></span></div>
    <div>Project (derived): <span class="proj" id="projectLabel"></span></div>
    <div>Selected folder: <span class="proj" id="folderStatus">Not selected</span></div>
  </div>

  <div id="printFooter" class="print-footer"></div>

  <div id="toast" class="toast" role="status" aria-live="polite">Saved</div>

  <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
    <div id="lightboxContent"></div>
  </div>

  <div id="storageModal" class="lightbox" onclick="this.style.display='none'">
    <div class="storage-panel" onclick="event.stopPropagation()">
      <div class="storage-header">
        <h3 class="storage-title">Local Storage Viewer</h3>
        <div class="storage-actions">
          <button id="copyStorageBtn">Copy</button>
          <button id="downloadStorageBtn">Download JSON</button>
          <button onclick="document.getElementById('storageModal').style.display='none'">Close</button>
        </div>
      </div>
      <pre id="storagePre" class="storage-output"></pre>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.addEventListener("error", e => {
        const t = document.getElementById("toast");
        if (t) {
          t.textContent = "JS error: " + (e.message || String(e.error));
          t.classList.add("show");
        }
        console.error(e);
      });

      const urlProjectOverride = new URLSearchParams(location.search).get("project");
      const urlType = new URLSearchParams(location.search).get("type");
      const typeMap = {
        maintenance: "Maintenance",
        inspection: "Inspection",
        rental: "Rental",
        "quality-inspection": "Quality inspection",
        "site-visit": "Site Visit",
        report: "Report"
      };
      const reportPrefixMap = {
        maintenance: "MNT",
        inspection: "INS",
        rental: "RNT",
        "quality-inspection": "QIN",
        report: "RPT",
        "site-visit": "SVR"
      };
      const selectedReportType = typeMap[urlType] || "Inspection";
      const selectedReportPrefix = reportPrefixMap[urlType] || "INS";
      const MAX_MEDIA_SCAN = 500;
      const STOP_AFTER_MISSING = 10;

      function getFolderName() {
        try {
          const path = decodeURIComponent(location.pathname);
          const parts = path.replace(/\/+$/, "").split("/");
          if (parts.length >= 2 && /\.html?$/i.test(parts[parts.length - 1])) {
            return parts[parts.length - 2] || "root";
          }
          return parts[parts.length - 1] || "root";
        } catch {
          return "project";
        }
      }

      const folderName = (urlProjectOverride || getFolderName()).trim() || "project";
      const prefix = folderName + "_";
      const jsonFileName = folderName + "_remarks.json";

      let selectedDirHandle = null;
      let saveTimer = null;
      let jsonSaveTimer = null;

      document.getElementById("prefixLabel").textContent = prefix;
      document.getElementById("projectLabel").textContent = folderName;

      function formatReportDate(value) {
        const date = new Date(value);
        const safeDate = Number.isNaN(date.getTime()) ? new Date() : date;
        const yyyy = safeDate.getFullYear();
        const mm = String(safeDate.getMonth() + 1).padStart(2, "0");

      function getReportCatalog() {
        try {
          const raw = localStorage.getItem(reportCatalogKey);
          const parsed = raw ? JSON.parse(raw) : [];
          const seen = new Set();
          const unique = parsed.filter(report => {
            const identity = String(report.reportNo || report.id || "").trim().toUpperCase();
            if (!identity || seen.has(identity)) return false;
            seen.add(identity);
            return true;
          });
          if (unique.length !== parsed.length) saveReportCatalog(unique);
          return unique;
        } catch {
          return [];
        }
      }

      function saveReportCatalog(list) {
        const seen = new Set();
        const unique = list.filter(report => {
          const identity = String(report.reportNo || report.id || "").trim().toUpperCase();
          if (!identity || seen.has(identity)) return false;
          seen.add(identity);
          return true;
        });
        localStorage.setItem(reportCatalogKey, JSON.stringify(unique));
      }

      function collectReportFromForm() {
        const payload = { id: Date.now().toString(36) };
        reportFields.forEach(field => {

        payload.inspectionTitle = document.getElementById("inspectionTitle")?.value || payload.inspectionTitle || selectedReportType;
        payload.inspectionType = payload.inspectionType || selectedReportType;
        payload.reportType = urlType || "inspection";

        if (!report) return;

      function renderReportList(searchText = "") {
        const list = getReportCatalog();
        const query = (searchText || "").trim().toLowerCase();
        const filtered = list.filter(report => {
          const reportNumber = String(report.reportNo || "");
          const reportType = String(report.reportType || "");
          const inspectionType = String(report.inspectionType || "");
          const belongsToSelectedType = reportNumber.startsWith(selectedReportPrefix + "-")
            || reportType === urlType
            || inspectionType.toLowerCase() === selectedReportType.toLowerCase();
          if (!belongsToSelectedType) return false;
          const searchable = [
            report.reportTitle, report.reportNo, report.reportDate, report.createdBy,
            report.preparedBy, report.inspectionType, report.productReference,
            report.customerName, report.factoryName, report.reportRemarks
          ].join(" ").toLowerCase();
          return !query || searchable.includes(query);
        });

        const reportList = document.getElementById("reportList");
        if (!filtered.length) {
          reportList.innerHTML = '<div class="crud-row"><span>No saved reports found</span></div>';
          return;
        }

        reportList.innerHTML = filtered.map(report => `
          <div class="crud-row" data-report-id="${report.id}">

              <strong>${(report.reportNo || report.reportTitle || "Untitled").replace(/</g, "&lt;")}</strong>

        reportList.querySelectorAll("[data-select-report]").forEach(button => {
          button.addEventListener("click", () => {
            const selected = filtered.find(item => item.id === button.dataset.selectReport);
            if (selected) {

              showToast("Loaded report: " + (selected.reportNo || selected.reportTitle || "Untitled"));

      function getNextReportNumber() {
        const list = getReportCatalog();
        let highest = 0;

        list.forEach(report => {
          const match = String(report.reportNo || "").match(new RegExp(`^${selectedReportPrefix}-(\\d+)$`));
          if (match) {
            highest = Math.max(highest, Number(match[1]));
          }

      function saveCurrentReport() {

        const payload = collectReportFromForm();
        const selectedId = document.querySelector("[data-report-id].selected")?.dataset.reportId;
        payload.reportNo = String(payload.reportNo || "").trim().toUpperCase();
        const selectedIndex = selectedId ? list.findIndex(item => item.id === selectedId) : -1;
        const reportNumberIndex = payload.reportNo
          ? list.findIndex(item => String(item.reportNo || "").trim().toUpperCase() === payload.reportNo)
          : -1;
        const existingIndex = selectedIndex >= 0 ? selectedIndex : reportNumberIndex;

        if (existingIndex >= 0) {
          payload.id = list[existingIndex].id;
          list[existingIndex] = payload;
          window.dispatchEvent(new CustomEvent("report-saved", { detail: payload }));
          showToast("Updated report");
        } else {
          const nextNumber = getNextReportNumber();
          const tx = payload.reportNo || `${selectedReportPrefix}-${String(nextNumber).padStart(4, "0")}`;

          payload.id = `rep_${Date.now().toString(36)}`;

      function fmtExposure(ex) {

      async function verifyPermission(handle, readWrite = true) {

      function createPlaceholderCard(i) {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `

      function loadMediaForIndex(i) {
        const patterns = [
          ...imagePatterns.map(fn => ({ kind: "img", fn })),
          ...videoPatterns.map(fn => ({ kind: "video", fn })),
        ];

        return new Promise(resolve => {
          let k = 0;
          tryNext();

          function tryNext() {
            if (k >= patterns.length) {
              resolve(false);
              return;
            }
            const { kind, fn } = patterns[k++];
            const src = fn(i);

            if (kind === "img") {
              const probe = new Image();
              probe.onload = () => {
                render(kind, src, { width: probe.naturalWidth, height: probe.naturalHeight });
                resolve(true);
              };
              probe.onerror = tryNext;
              probe.src = src;
            } else {
              const v = document.createElement("video");
              v.preload = "metadata";
              v.onloadedmetadata = () => {
                render(kind, src, {
                  width: v.videoWidth,
                  height: v.videoHeight,
                  duration: v.duration
                });
                resolve(true);
              };
              v.onerror = tryNext;
              v.src = src;
            }
          }

          function render(kind, src, meta) {
            const card = document.getElementById("card" + i);
            if (!card) return;

            const wrap = card.querySelector(".imgwrap");

            if (kind === "img") {
              wrap.innerHTML = `<img src="${src}" alt="photo ${i}" loading="lazy" />`;

              if (window.exifr && exifr.parse) {
                exifr.parse(src).then(x => {
                  const bits = [];
                  if (x?.Make || x?.Model) bits.push(`Camera: ${[x.Make, x.Model].filter(Boolean).join(" ")}`);
                  if (x?.DateTimeOriginal) bits.push(`Date: ${x.DateTimeOriginal}`);
                  const exp = fmtExposure(x?.ExposureTime);
                  if (exp) bits.push(`Exposure: ${exp}`);
                  if (x?.FNumber) bits.push(`Aperture: f/${x.FNumber}`);
                  if (x?.ISO) bits.push(`ISO: ${x.ISO}`);
                  if (x?.FocalLength) bits.push(`Focal: ${x.FocalLength}mm`);
                  if (meta?.width && meta?.height) bits.push(`Size: ${meta.width}×${meta.height}`);
                  card.querySelector(".metadata").textContent = bits.join(" | ") || "No readable metadata";
                }).catch(() => {
                  card.querySelector(".metadata").textContent = "No metadata (image)";
                });
              }
            } else {
              wrap.innerHTML = `<video class="card-video" src="${src}" controls playsinline preload="metadata"></video>`;
              const bits = [];
              if (meta?.width && meta?.height) bits.push(`Size: ${meta.width}×${meta.height}`);
              if (typeof meta?.duration === "number" && isFinite(meta.duration)) {
                const d = Math.round(meta.duration);
                bits.push(`Duration: ${Math.floor(d / 60)}:${String(d % 60).padStart(2, '0')}`);
              }
              card.querySelector(".metadata").textContent = bits.join(" | ") || "Video";
            }
          }
        });
      }

      function createPrintHeader() {
        const header = document.querySelector("body > .header").cloneNode(true);

          element.removeAttribute("id");
          if (source && "value" in source && "value" in element) element.value = source.value;
        });
        return header;

      function buildPrintPages() {

          cards.slice(start, start + 3).forEach(card => row.appendChild(card));

      async function discoverMedia() {
        let found = 0;
        let missingInARow = 0;

        for (let i = 1; i <= MAX_MEDIA_SCAN && missingInARow < STOP_AFTER_MISSING; i++) {
          createPlaceholderCard(i);
          const exists = await loadMediaForIndex(i);
          if (exists) {
            found++;
            missingInARow = 0;
            const card = document.getElementById("card" + i);
            if (card) {
              card.querySelector(".cap").textContent = found;
              card.querySelector("textarea").placeholder = `Add remarks for item ${found}...`;
            }
          } else {
            document.getElementById("card" + i)?.remove();
            missingInARow++;
          }
        }

        document.getElementById("mediaCount").textContent =
          `${found} ${found === 1 ? "photo" : "photos"}`;
        buildPrintPages();
      }

      window.chooseSaveFolder = async function () {
        try {
          if (!window.showDirectoryPicker) {
            alert("This browser does not support local folder write access. Please use Chrome or Edge.");
            return;
          }

          const dirHandle = await window.showDirectoryPicker();
          const ok = await verifyPermission(dirHandle, true);

          if (!ok) {
            alert("Folder permission was not granted.");
            return;
          }

          selectedDirHandle = dirHandle;
          updateFolderStatus();
          showToast('Folder selected: ' + (dirHandle.name || 'chosen folder'));
        } catch (err) {
          console.error(err);
          alert("Folder selection failed: " + err.message);
        }
      };

      window.saveJsonToFolder = async function () {
        try {
          if (!selectedDirHandle) {
            alert("Please click 'Choose Folder' first.");
            return;
          }

          const ok = await verifyPermission(selectedDirHandle, true);
          if (!ok) {
            alert("No write permission for the selected folder.");
            return;
          }

          const payload = {
            project: folderName,
            prefix,
            savedAt: new Date().toISOString(),
            data: getRemarksData()
          };

          const fileHandle = await selectedDirHandle.getFileHandle(jsonFileName, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(JSON.stringify(payload, null, 2));
          await writable.close();

          showToast("JSON saved to folder");
        } catch (err) {
          console.error(err);
          alert("Save to folder failed: " + err.message);
        }
      };

      window.loadJsonFromFolder = async function () {
        try {
          if (!selectedDirHandle) {
            alert("Please click 'Choose Folder' first.");
            return;
          }

          const ok = await verifyPermission(selectedDirHandle, false);
          if (!ok) {
            alert("No permission to read the selected folder.");
            return;
          }

          const fileHandle = await selectedDirHandle.getFileHandle(jsonFileName);
          const file = await fileHandle.getFile();
          const text = await file.text();
          const obj = JSON.parse(text);

          if (!obj || !obj.data) throw new Error("Invalid JSON structure");

          applyRemarksData(obj.data);
          showToast("JSON loaded from folder");
        } catch (err) {
          console.error(err);
          alert("Load from folder failed: " + err.message);
        }
      };

      updateFolderStatus();
    });
  </script>
</body>

</html>
