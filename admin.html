<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User access · ClearLED</title>
  <style>
    :root{color-scheme:dark;--ink:#eef7ff;--muted:#91aeca;--line:#294a68;--panel:#102438;--surface:#081522;--accent:#52cdfd;--green:#62e6a7;--red:#ff8796}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 86% 0,#123d61 0,transparent 34rem),linear-gradient(180deg,#071321,#0a1729);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{width:min(1160px,calc(100% - 36px));margin:auto;padding:26px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.logo{height:42px;max-width:130px;padding:6px 9px;border-radius:8px;background:#fff;object-fit:contain}.brand span{font-size:12px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.nav{display:flex;gap:8px}.button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;color:#d7e8f5;background:#091726;text-decoration:none;cursor:pointer;font-size:12px}.hero{padding:58px 0 28px}.eyebrow{color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:8px 0 10px;font-size:clamp(34px,5vw,54px);letter-spacing:-.045em}.hero p{max-width:720px;margin:0;color:var(--muted);line-height:1.55}.panel{border:1px solid var(--line);border-radius:16px;background:#0e2133;box-shadow:0 20px 55px #0005;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:18px}.status{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}th{color:#9ab5ce;background:#0a1928;font-size:10px;letter-spacing:.08em;text-transform:uppercase}tbody tr:nth-child(even){background:#102a40}tbody tr:last-child td{border-bottom:0}.user strong{display:block;font-size:13px}.user small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.role{display:inline-flex;padding:4px 8px;border-radius:999px;color:#bdeeff;background:#123f55;font-size:10px;font-weight:850;text-transform:uppercase}.role.admin{color:#ffe79b;background:#51420e}.permission{text-align:center}.switch{position:relative;display:inline-block;width:42px;height:24px}.switch input{width:0;height:0;opacity:0}.slider{position:absolute;inset:0;border:1px solid #426079;border-radius:999px;background:#152637;cursor:pointer;transition:.15s}.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#8094a7;transition:.15s}.switch input:checked+.slider{border-color:#2c9870;background:#15573f}.switch input:checked+.slider:before{transform:translateX(18px);background:var(--green)}.switch input:disabled+.slider{cursor:not-allowed;opacity:.45}.message{display:none;margin-bottom:16px;padding:12px 14px;border:1px solid #78424d;border-radius:9px;color:#ffd1d8;background:#351922}.message.show{display:block}.empty{padding:42px;text-align:center;color:var(--muted)}@media(max-width:700px){.wrap{width:min(100% - 22px,1160px)}.top{align-items:flex-start}.brand span{display:none}.hero{padding-top:42px}.panel-head{align-items:flex-start;flex-direction:column}}
  </style>
  <style>
    .role.superuser{color:#fff3bf;background:#574400}
    .crud-grid{display:inline-grid;grid-template-columns:repeat(4,24px);gap:4px}
    .crud-btn{min-width:24px;height:24px;padding:0;border:1px solid #35546f;border-radius:4px;background:#0f2435;color:#9ebad1;font-size:9px;font-weight:400;letter-spacing:.02em;cursor:pointer}
    .crud-btn.active{border-color:#63e6be;background:#1b5b48;color:#dffcf1;box-shadow:0 0 0 1px #63e6be2e inset}
    .crud-btn:disabled{opacity:.45;cursor:not-allowed}
    .permission small{display:block;margin-top:6px;color:var(--muted);font-size:10px}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><img class="logo" src="company-logo.png" alt="ClearLED"><span>Administration</span></div><nav class="nav"><a class="button" href="applications.html" aria-label="Home">⌂ Home</a><a class="button" href="maintenance.html">Maintenance</a><button class="button" id="signout" type="button">Sign out</button></nav></header>
    <section class="hero"><div class="eyebrow">Access management</div><h1>Application usage rights</h1><p>Choose which engineering applications each authenticated user may open. Changes are saved immediately to DataBase.</p></section>
    <div class="message" id="message" role="alert"></div>
    <section class="panel"><div class="panel-head"><h2>Workspace users</h2><span class="status" id="status">Checking administrator access…</span></div><div class="table-wrap" id="table-wrap"></div></section>
  </main>
  <script type="module">
    import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import{collection,doc,getDoc,getDocs,getFirestore,updateDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const SUPERUSER_EMAIL="totem1997@gmail.com";
    const CRUD_KEYS=["c","r","u","d"];
    const CRUD_LABEL={c:"C",r:"R",u:"U",d:"D"};
    const ALL_CRUD={c:true,r:true,u:true,d:true};

    const config={apiKey:"AIzaSyAmPf0yWWQI35pNGX1FcsVZJhd3ADMhY78",authDomain:"led-db-465b0.firebaseapp.com",projectId:"led-db-465b0",storageBucket:"led-db-465b0.firebasestorage.app",messagingSenderId:"922283607413",appId:"1:922283607413:web:f58b3e9ebd507082b03f3c"};
    const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),status=document.getElementById("status"),tableWrap=document.getElementById("table-wrap"),message=document.getElementById("message");
    const applications=[{key:"database",label:"LED Database"},{key:"calculator",label:"Brightness Calculator"},{key:"cableSizing",label:"Cable Sizing"},{key:"comparison",label:"LED Comparison"},{key:"reportGenerator",label:"Report Generator"},{key:"components",label:"Parts & Equipment Database"},{key:"salesProjects",label:"Sales Projects"},{key:"maintenance",label:"Maintenance"}];

    let actor=null,userMap=new Map();

    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[char]);
    const showError=text=>{message.textContent=text;message.classList.add("show")};
    const isSuperuser=user=>user?.role==="superuser"||String(user?.email||"").toLowerCase()===SUPERUSER_EMAIL;
    const effectiveRole=user=>isSuperuser(user)?"superuser":(user?.role||"user");

    function normalizeCrudPermission(raw,role){
      if(role==="superuser")return{...ALL_CRUD};
      if(raw&&typeof raw==="object")return{c:raw.c===true,r:raw.r===true,u:raw.u===true,d:raw.d===true};
      if(raw===true)return role==="admin"?{...ALL_CRUD}:{c:false,r:true,u:false,d:false};
      if(role==="admin")return{...ALL_CRUD};
      return{c:false,r:false,u:false,d:false};
    }

    function canEditUser(actorUser,targetUser){
      const actorRole=effectiveRole(actorUser),targetRole=effectiveRole(targetUser);
      if(actorRole==="superuser")return targetRole!=="superuser"||actorUser.uid===targetUser.uid;
      if(actorRole!=="admin")return false;
      return targetRole==="user";
    }

    function renderCrudButtons(user,appKey){
      const role=effectiveRole(user),crud=normalizeCrudPermission(user.permissions?.[appKey],role),editable=canEditUser(actor,user)&&role!=="superuser";
      return `<div class="crud-grid">${CRUD_KEYS.map(op=>`<button type="button" class="crud-btn ${crud[op]?"active":""}" data-uid="${user.uid}" data-app="${appKey}" data-op="${op}" ${editable?"":"disabled"}>${CRUD_LABEL[op]}</button>`).join("")}</div><small>${editable?"Toggle C/R/U/D":"Locked"}</small>`;
    }

    function renderUsers(users){
      status.textContent=`${users.length} user${users.length===1?"":"s"}`;
      tableWrap.innerHTML=users.length?`<table><thead><tr><th>User</th><th>Role</th>${applications.map(item=>`<th class="permission">${item.label}</th>`).join("")}</tr></thead><tbody>${users.map(user=>{const role=effectiveRole(user);return`<tr><td class="user"><strong>${escapeHtml(user.displayName||user.email||"Unnamed user")}</strong><small>${escapeHtml(user.email||user.uid)}</small></td><td><span class="role ${role==="admin"?"admin":role==="superuser"?"superuser":""}">${escapeHtml(role)}</span></td>${applications.map(item=>`<td class="permission">${renderCrudButtons(user,item.key)}</td>`).join("")}</tr>`}).join("")}</tbody></table>`:'<div class="empty">No user profiles exist yet. A profile is created after a user signs in.</div>';
    }

    async function loadUsers(currentUser){
      const own=await getDoc(doc(db,"users",currentUser.uid));
      if(!own.exists()){status.textContent="Access denied";showError("User profile is required.");tableWrap.innerHTML='<div class="empty">Return to Applications.</div>';return}
      actor={uid:currentUser.uid,...own.data(),email:own.data().email||currentUser.email||""};
      if(!["admin","superuser"].includes(effectiveRole(actor))){status.textContent="Access denied";showError("Administrator permission is required to manage application rights.");tableWrap.innerHTML='<div class="empty">Return to Applications.</div>';return}
      const snapshot=await getDocs(collection(db,"users"));
      const users=snapshot.docs.map(item=>{const data=item.data();return{uid:item.id,...data,email:data.email||""}}).sort((a,b)=>String(a.email||"").localeCompare(String(b.email||"")));
      userMap=new Map(users.map(user=>[user.uid,user]));
      renderUsers(users);
    }

    tableWrap.addEventListener("click",async event=>{
      const button=event.target.closest("button[data-uid][data-app][data-op]");
      if(!button||button.disabled)return;
      message.classList.remove("show");
      const {uid,app:appKey,op}=button.dataset;
      const user=userMap.get(uid);
      if(!user)return;
      const role=effectiveRole(user);
      if(!canEditUser(actor,user)||role==="superuser")return;
      const current=normalizeCrudPermission(user.permissions?.[appKey],role);
      const next={...current,[op]:!current[op]};
      if(op!=="r"&&next[op])next.r=true;
      if(op==="r"&&!next.r){next.c=false;next.u=false;next.d=false}
      button.disabled=true;
      try{
        await updateDoc(doc(db,"users",uid),{[`permissions.${appKey}`]:next});
        user.permissions={...(user.permissions||{}),[appKey]:next};
        userMap.set(uid,user);
        renderUsers([...userMap.values()].sort((a,b)=>String(a.email||"").localeCompare(String(b.email||""))));
        status.textContent="Permissions saved";
      }catch(error){
        showError("Could not save permission: "+(error.message||error));
      }
    });

    onAuthStateChanged(auth,user=>{if(!user)location.replace("index.html");else loadUsers(user).catch(error=>showError("Could not load users: "+(error.message||error)))});
    document.getElementById("signout").addEventListener("click",async()=>{await signOut(auth);sessionStorage.removeItem("clearled_authenticated");localStorage.removeItem("clearled_authenticated");location.replace("index.html")});
  </script>
</body>
</html>
