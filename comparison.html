<!doctype html>
<html lang="en" data-application="comparison">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LED Product Comparison</title>
  <meta name="description" content="Interactive comparison of eight integrated-driver RGB LED products." />
  <script type="module" src="access-guard.js"></script>
  <style>
    :root {
      --ink: #eef7ff;
      --muted: #8faecf;
      --line: #284a6d;
      --panel: #10263d;
      --surface: #091726;
      --surface-2: #12304f;
      --header: #0a1830;
      --accent: #4ec5ff;
      --accent-soft: rgba(78, 197, 255, 0.16);
      --red: #ff6b6b;
      --green: #63e6be;
      --blue: #5ecbff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #071321 0%, #0b1830 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    [hidden] { display: none !important; }
    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 1.05fr) minmax(380px, .95fr);
      background:
        radial-gradient(circle at 16% 18%, rgba(78, 197, 255, .15), transparent 32%),
        linear-gradient(145deg, #06111e 0%, #0a1d32 58%, #0b2742 100%);
    }
    .auth-story {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 42px clamp(34px, 6vw, 92px);
      overflow: hidden;
      border-right: 1px solid rgba(143, 174, 207, .18);
    }
    .auth-story::after {
      content: "";
      position: absolute;
      right: -130px;
      bottom: -130px;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(78, 197, 255, .16);
      border-radius: 50%;
      box-shadow: 0 0 0 72px rgba(78, 197, 255, .035), 0 0 0 144px rgba(78, 197, 255, .025);
      pointer-events: none;
    }
    .auth-brand { display: flex; align-items: center; gap: 13px; position: relative; z-index: 1; }
    .auth-logo {
      width: auto;
      height: 42px;
      max-width: 130px;
      object-fit: contain;
      padding: 6px 9px;
      border-radius: 8px;
      background: #fff;
    }
    .auth-brand-name { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .auth-copy { position: relative; z-index: 1; max-width: 630px; margin: auto 0; padding: 72px 0; }
    .auth-eyebrow { margin: 0 0 18px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    .auth-copy h1 { max-width: 600px; font-size: clamp(40px, 5vw, 72px); line-height: .98; letter-spacing: -.055em; }
    .auth-copy p { max-width: 520px; margin: 24px 0 0; color: #a9bfd7; font-size: 17px; line-height: 1.65; }
    .auth-meta { position: relative; z-index: 1; color: #7894b0; font-size: 12px; }
    .auth-panel {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px;
      background: rgba(4, 13, 23, .28);
    }
    .auth-card { width: min(100%, 430px); }
    .auth-card h2 { margin: 0; font-size: 30px; letter-spacing: -.035em; }
    .auth-intro { margin: 10px 0 30px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .auth-form { display: grid; gap: 18px; }
    .auth-field { display: grid; gap: 8px; }
    .auth-label { color: #c9d9e9; font-size: 12px; font-weight: 650; }
    .auth-input-wrap { position: relative; }
    .auth-input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #294967;
      border-radius: 9px;
      outline: none;
      color: var(--ink);
      background: rgba(15, 39, 62, .8);
      transition: border-color .15s, box-shadow .15s;
    }
    .auth-input::placeholder { color: #66819d; }
    .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .auth-input.password { padding-right: 72px; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      padding: 8px;
      border: 0;
      color: #9eb5cc;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .auth-options { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .remember { display: flex; align-items: center; gap: 8px; color: #a9bfd7; font-size: 12px; cursor: pointer; }
    .remember input { accent-color: var(--accent); }
    .auth-link { color: var(--accent); font-size: 12px; text-decoration: none; }
    .auth-submit {
      height: 50px;
      border: 0;
      border-radius: 9px;
      color: #06111e;
      background: linear-gradient(135deg, #8ee7ff 0%, #4ec5ff 100%);
      box-shadow: 0 10px 24px rgba(78, 197, 255, .2);
      cursor: pointer;
      font-weight: 800;
    }
    .auth-submit:hover { filter: brightness(1.06); }
    .auth-submit:focus-visible { outline: 3px solid rgba(142, 231, 255, .35); outline-offset: 3px; }
    .auth-error { min-height: 18px; margin: -5px 0 0; color: #ff9191; font-size: 12px; }
    .auth-note {
      display: flex;
      gap: 10px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid rgba(143, 174, 207, .16);
      color: #7894b0;
      font-size: 11px;
      line-height: 1.5;
    }
    .lock-dot { flex: 0 0 auto; width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(99,230,190,.1); }
    .app { min-height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 28px;
      color: white;
      background: linear-gradient(135deg, #0a1830 0%, #12304f 100%);
      border-bottom: 1px solid #213a55;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .mark {
      display: grid;
      grid-template-columns: repeat(3, 8px);
      gap: 3px;
      padding: 8px;
      border: 1px solid #53616e;
      border-radius: 8px;
      background: #1c2731;
    }
    .company-logo {
      display: block;
      width: auto;
      max-width: 120px;
      height: 44px;
      object-fit: contain;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.14);
      background: white;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }
    .mark i { width: 8px; height: 8px; border-radius: 50%; }
    .mark i:nth-child(1) { background: var(--red); }
    .mark i:nth-child(2) { background: var(--green); }
    .mark i:nth-child(3) { background: var(--blue); }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .sub { margin-top: 3px; color: #bac5ce; font-size: 10px; }
    .counter {
      color: #dce5ec;
      font-size: 13px;
      white-space: nowrap;
    }
    .topbar-actions { display: flex; align-items: center; gap: 14px; }
    .signout-button {
      padding: 7px 10px;
      border: 1px solid rgba(143, 174, 207, .34);
      border-radius: 6px;
      color: #cfe0ef;
      background: rgba(9, 23, 38, .5);
      cursor: pointer;
      font-size: 11px;
    }
    .signout-button:hover { border-color: var(--accent); }
    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: calc(100vh - 81px);
    }
    aside {
      padding: 18px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }
    .control-section + .control-section { margin-top: 24px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #9dc4ee;
    }
    .actions { display: flex; gap: 4px; }
    .text-btn {
      padding: 3px 6px;
      border: 0;
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }
    .text-btn:hover { text-decoration: underline; }
    .search {
      width: 100%;
      margin-bottom: 10px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: var(--surface-2);
      color: var(--ink);
      font-size: 12px;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .check-list {
      display: grid;
      gap: 2px;
      max-height: 300px;
      overflow: auto;
      padding-right: 4px;
    }
    .check {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: start;
      padding: 7px 6px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.3;
    }
    .check:hover { background: rgba(78, 197, 255, 0.12); }
    .check input { margin: 1px 0 0; accent-color: var(--accent); }
    .check small { display: block; color: var(--muted); margin-top: 1px; }
    .product-picker { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: end; margin-bottom: 12px; }
    .picker-label { display: grid; gap: 5px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .picker-label-line { display: flex; align-items: center; gap: 7px; }
    .picker-count-badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid #4ba7c5; border-radius: 999px; color: #dff8ff; background: #17607a; box-shadow: 0 0 0 2px rgba(78,197,255,.1); font-size: 10px; font-weight: 900; letter-spacing: 0; }
    .picker-row { display: grid; grid-template-columns: minmax(0, 1fr) 38px; gap: 7px; }
    .picker-select {
      width: 100%; min-width: 0; height: 36px; padding: 0 9px; border: 1px solid var(--line);
      border-radius: 6px; outline: none; color: var(--ink); background: var(--surface-2); font-size: 11px;
    }
    .picker-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .product-action { border: 1px solid #39789d; border-radius: 6px; color: #06111e; background: var(--accent); cursor: pointer; font-size: 20px; font-weight: 800; line-height: 1; }
    .product-action:disabled { cursor: not-allowed; opacity: .35; }
    .selected-product {
      display: grid; grid-template-columns: 16px minmax(82px, .8fr) minmax(112px, 1.2fr) 28px; gap: 7px; align-items: center;
      padding: 7px 6px; border: 1px solid transparent; border-radius: 6px; background: rgba(9,23,38,.32);
      cursor: grab; font-size: 12px; line-height: 1.25;
    }
    .selected-product:hover { border-color: #315c7d; background: rgba(78,197,255,.1); }
    .selected-product.dragging { opacity: .42; }
    .selected-product.drag-over { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .drag-handle { color: #6f91b3; text-align: center; font-size: 15px; letter-spacing: -3px; user-select: none; }
    .selection-pill { display: flex; align-items: center; min-width: 0; gap: 5px; color: var(--product-color); font-size: 10px; font-weight: 750; }
    .selection-pill span:last-child { min-width: 0; overflow-wrap: anywhere; }
    .product-order-badge { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--product-color); border-radius: 999px; color: #06111e; background: var(--product-color); font-size: 10px; font-weight: 900; }
    .selected-product strong { display: block; overflow-wrap: anywhere; font-weight: 650; }
    .selected-product small { display: block; margin-top: 2px; color: var(--muted); }
    .remove-product { width: 28px; height: 28px; border: 1px solid #6c4050; border-radius: 5px; color: #ffb1bd; background: #321824; cursor: pointer; font-size: 18px; line-height: 1; }
    .selected-empty { padding: 12px 7px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    main { min-width: 0; padding: 18px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toggle-aside {
      padding: 8px 12px;
      border: 1px solid #4eb7f0;
      border-radius: 999px;
      color: #071321;
      background: linear-gradient(135deg, #8ee7ff 0%, #4ec5ff 100%);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(78, 197, 255, 0.22);
    }
    .mode {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
    }
    .mode button {
      padding: 7px 11px;
      border: 0;
      border-radius: 999px;
      color: #a5c0de;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }
    .mode button.active { color: #071321; background: linear-gradient(135deg, #8ee7ff 0%, #4ec5ff 100%); }
    .resize-hint {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .resize-hint::before {
      content: "↔";
      color: var(--accent);
      font-size: 15px;
      line-height: 1;
    }
    .export-actions { display: flex; gap: 8px; }
    .button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface-2);
      cursor: pointer;
      font-size: 12px;
    }
    .button:hover { border-color: var(--accent); background: #17456d; }
    .table-shell {
      overflow: auto;
      max-height: calc(100vh - 154px);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(2, 10, 20, 0.28);
    }
    table {
      width: 100%;
      min-width: 900px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 12px;
    }
    th, td {
      padding: 9px 10px;
      text-align: center;
      vertical-align: middle;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      height: 62px;
      color: white;
      background: var(--header);
      font-weight: 700;
    }
    thead th:first-child {
      left: 0;
      z-index: 5;
      width: 230px;
    }
    tbody th {
      position: sticky;
      left: 0;
      z-index: 2;
      width: 230px;
      background: var(--surface);
      font-weight: 700;
    }
    tbody tr:nth-child(even) td,
    tbody tr:nth-child(even) th { background-color: #0e2235; }
    tbody tr:nth-child(even) td.normalized { background-color: #173653; }
    tbody tr:hover td, tbody tr:hover th { background-color: #12304f; }
    tbody tr:hover td.normalized { background-color: #183b5d; }
    .maker { display: block; font-size: 11px; opacity: .82; }
    .part { display: block; margin-top: 3px; }
    .normalized { background: #102942; color: var(--ink); }
    thead th.normalized { color: var(--ink); }
    thead th.product-column {
      border-top: 3px solid var(--product-color); color: var(--product-color); cursor: grab;
      background: color-mix(in srgb, var(--product-color) 10%, var(--header));
    }
    thead th.product-column:active { cursor: grabbing; }
    thead th.product-column.column-dragging { opacity: .42; }
    thead th.product-column.column-drag-target { box-shadow: inset 4px 0 0 var(--accent); }
    thead th.product-group-end, tbody td.product-group-end { border-right: 3px solid color-mix(in srgb, var(--product-color) 65%, var(--line)); }
    .column-kind { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    tbody td.product-cell { background: color-mix(in srgb, var(--product-color) 5%, var(--surface)); }
    tbody tr:nth-child(even) td.product-cell { background: color-mix(in srgb, var(--product-color) 10%, #0e2235); }
    tbody td.product-cell.normalized { background: color-mix(in srgb, var(--product-color) 10%, #102942); }
    tbody tr:nth-child(even) td.product-cell.normalized { background: color-mix(in srgb, var(--product-color) 15%, #173653); }
    tbody tr:hover td.product-cell { background: color-mix(in srgb, var(--product-color) 16%, #12304f); }
    tbody tr[data-field-row] th { cursor: grab; }
    tbody tr[data-field-row].row-dragging { opacity: .42; }
    tbody tr[data-field-row].row-drag-target th,
    tbody tr[data-field-row].row-drag-target td { box-shadow: inset 0 3px 0 var(--accent); }
    .row-red th { color: var(--red); }
    /* Resizer handle */
    .col-resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 100%;
      cursor: col-resize;
      z-index: 6;
      background: transparent;
      touch-action: none;
    }
    .col-resizer::after {
      content: "";
      position: absolute;
      top: 20%;
      right: 2px;
      width: 2px;
      height: 60%;
      border-radius: 2px;
      background: rgba(78, 197, 255, .42);
      opacity: 0;
      transition: opacity .15s;
    }
    thead th:hover .col-resizer::after,
    .col-resizer:focus-visible::after { opacity: 1; }
    .layout { transition: grid-template-columns 200ms ease; }
    aside { transition: width 200ms ease, padding 200ms ease, visibility 200ms ease; }
    .layout.aside-collapsed { grid-template-columns: 0 1fr; }
    .layout.aside-collapsed aside {
      width: 0 !important;
      padding: 0 !important;
      visibility: hidden !important;
      overflow: hidden !important;
      border-right: 0 !important;
    }
    .row-green th { color: var(--green); }
    .row-blue th { color: var(--blue); }
    /* Full-page mode: hide header and aside, expand table to full viewport */
    .app.fullpage header.topbar { display: none !important; }
    .app.fullpage .layout { grid-template-columns: 0 1fr !important; }
    .app.fullpage aside { width: 0 !important; padding: 0 !important; visibility: hidden !important; border-right: 0 !important; }
    .app.fullpage main { padding: 12px 6px 18px 12px; }
    .app.fullpage .table-shell { max-height: calc(100vh - 24px); border-radius: 0; }
    .empty {
      padding: 54px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .assumption {
      margin: 10px 2px 0;
      color: #b4cae3;
      font-size: 11px;
    }
    @media (max-width: 900px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-story { min-height: auto; padding: 28px 28px 36px; border-right: 0; border-bottom: 1px solid rgba(143, 174, 207, .18); }
      .auth-copy { margin: 48px 0 0; padding: 0; }
      .auth-copy h1 { font-size: clamp(36px, 9vw, 58px); }
      .auth-copy p { font-size: 15px; }
      .auth-meta { display: none; }
      .auth-panel { min-height: auto; padding: 52px 28px 72px; }
      .layout { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid #d5dde5; }
      .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .control-section + .control-section { margin-top: 0; }
      .check-list { max-height: 190px; }
      main { padding: 12px; }
      .table-shell { max-height: 68vh; }
    }
    @media (max-width: 620px) {
      .auth-story { padding: 22px 20px 30px; }
      .auth-copy { margin-top: 38px; }
      .auth-panel { padding: 42px 20px 64px; }
      .auth-options { align-items: flex-start; flex-direction: column; gap: 10px; }
      .topbar { padding: 16px; align-items: flex-start; }
      .counter { display: none; }
      aside { padding: 12px 10px; }
      .controls-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
      .control-section { min-width: 0; }
      .control-section + .control-section { margin-top: 0; }
      .section-head { align-items: flex-start; gap: 4px; }
      .section-head h2 { font-size: 10px; line-height: 1.35; }
      .actions { gap: 0; }
      .text-btn { padding: 2px 4px; font-size: 10px; }
      .search { margin-bottom: 7px; padding: 8px; }
      .check-list { max-height: 260px; padding-right: 2px; }
      .check { grid-template-columns: 17px minmax(0, 1fr); gap: 5px; padding: 6px 3px; font-size: 11px; }
      .check span { min-width: 0; overflow-wrap: anywhere; }
      .toolbar { align-items: stretch; }
      .toolbar-left { width: 100%; gap: 7px; }
      .mode { flex: 1; }
      .mode button { flex: 1; padding: 7px 8px; font-size: 0; }
      .mode button::after { content: attr(data-mobile-label); font-size: 11px; }
      .resize-hint { width: 100%; padding-left: 3px; }
      .export-actions { width: 100%; }
      .button { flex: 1; }
      thead th { height: 46px; padding: 6px 8px; font-size: 11px; }
      thead .maker { display: none; }
      thead .part { margin-top: 0; line-height: 1.2; }
      .col-resizer::after { opacity: .72; }
    }
    @media print {
      .topbar, aside, .toolbar, .assumption { display: none !important; }
      .layout { display: block; }
      main { padding: 0; }
      .table-shell { max-height: none; overflow: visible; border: 0; box-shadow: none; }
      table { min-width: 0; font-size: 8px; }
      thead th, tbody th { position: static; }
      th, td { padding: 4px; }
    }

      ["Luminous Intensity — Green", ["325 – 489 mcd @ 3.2 mA","320 – 600 mcd @ 3.53 mA","1010 – 1600 mcd @ 8 mA","N/S – 70 mcd @ 3.2 mA","N/S – 195 mcd @ 3.2 mA","N/S – 375 mcd @ 3.2 mA","N/S – 356.1 mcd @ 3.2 mA","N/S – 433 mcd @ 3.2 mA"], ["325.0 – 489.0 mcd","290.1 – 543.9 mcd","404.0 – 640.0 mcd","N/S – 70.0 mcd","N/S – 195.0 mcd","N/S – 375.0 mcd","N/S – 356.1 mcd","N/S – 433.0 mcd"], "Typical Min ~ Max"],
      ["Luminous Intensity — Blue", ["66 – 100 mcd @ 3.2 mA","70 – 125 mcd @ 3.53 mA","224 – 355 mcd @ 8 mA","N/S – 18 mcd @ 3.2 mA","N/S – 34 mcd @ 3.2 mA","N/S – 72 mcd @ 3.2 mA","N/S – 70.8 mcd @ 3.2 mA","N/S – 78.7 mcd @ 3.2 mA"], ["66.0 – 100.0 mcd","63.5 – 113.3 mcd","89.6 – 142.0 mcd","N/S – 18.0 mcd","N/S – 34.0 mcd","N/S – 72.0 mcd","N/S – 70.8 mcd","N/S – 78.7 mcd"], "Typical Min ~ Max"],
      ["Dominant Wavelength — Red", ["618 – 623 nm @ 3.2 mA","610 – 630 nm @ 3.53 mA","619 – 624 nm @ 8 mA","Not specified","Not specified","Not specified","Not specified","Not specified"], [], "Color bin ranges"],
      ["Dominant Wavelength — Green", ["524 – 528 nm @ 3.2 mA","525 – 545 nm @ 3.53 mA","522.5 – 540 nm @ 8 mA","Not specified","Not specified","Not specified","Not specified","Not specified"], [], "Color bin ranges"],
      ["Dominant Wavelength — Blue", ["469 – 474 nm @ 3.2 mA","460 – 480 nm @ 3.53 mA","465 – 480 nm @ 8 mA","Not specified","Not specified","Not specified","Not specified","Not specified"], [], "Color bin ranges"],
      ["Junction Temperature (Tj)", ["Not specified","Not specified","−40 ~ +125 °C","Not specified","Not specified","Not specified","Not specified","Not specified"], [], "—"],
      ["Absolute Max. Supply Voltage", ["12 V","6 V","3.6 V","Not specified","Not specified","Not specified","Not specified","Not specified"], [], "—"],
      ["ESD Protection (HBM)", ["4 kV","2 kV","2 kV","Not specified","Not specified","Not specified","Not specified","Not specified"], [], "—"],
      ["Key Features (Highlights)", ["16-bit PWM, 16-level current, OVP, EMS error monitoring, wide voltage (3.3–12 V)","Dual data backup, long string support, low static current","24-bit color, very high refresh rate, health monitor, CRC and gamma","Ultra-small 1010 package","1515 package, 16-bit PWM","Higher-output 1515 option, 16-bit PWM","2020 package, backup data path","Highest preserved RGB output among later NationStar devices"], [], "Summary"]
    ].map((r, index) => {
      const asDisplayValue = value => value === "Not specified" ? "—" : value;
      const original = r[1].map(asDisplayValue);
      const normalized = Array.isArray(r[2]) ? r[2].map(asDisplayValue) : [];
      const filledNormalized = original.map((value, idx) => {
        const normalizedValue = normalized[idx];
        return normalizedValue != null && normalizedValue !== "" ? normalizedValue : value;
      });
      return { id: "field-" + index, label: r[0], original, normalized: filledNormalized, notes: r[3] };
    });

    const SETTINGS_KEY = "ledcmp_comparison_settings_v1";
    let savedSettings = {};
    try { savedSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (error) { savedSettings = {}; }
    const validProductIds = new Set(products.map(product => product.id));
    const validFieldIds = new Set(rows.map(row => row.id));
    if (Array.isArray(savedSettings.fieldOrder)) {
      const rank = new Map(savedSettings.fieldOrder.map((id, index) => [id, index]));
      rows.sort((a, b) => (rank.get(a.id) ?? Number.MAX_SAFE_INTEGER) - (rank.get(b.id) ?? Number.MAX_SAFE_INTEGER));
    }
    const restoredProducts = Array.isArray(savedSettings.selectedProducts) ? savedSettings.selectedProducts.filter(id => validProductIds.has(id)) : products.map(product => product.id);
    const restoredFields = Array.isArray(savedSettings.selectedFields) ? savedSettings.selectedFields.filter(id => validFieldIds.has(id)) : rows.map(row => row.id);
    const state = {
      selectedProducts: restoredProducts,
      selectedFields: new Set(restoredFields),
      mode: ["both", "original", "normalized"].includes(savedSettings.mode) ? savedSettings.mode : "both",
      query: "",
      selectedBrand: ""
    };

    function saveComparisonState() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          selectedProducts: state.selectedProducts,
          selectedFields: [...state.selectedFields],
          fieldOrder: rows.map(row => row.id),
          mode: state.mode
        }));
      } catch (error) { /* The comparison remains usable if browser storage is unavailable. */ }
    }

    const productList = document.getElementById("product-list");
    const brandCount = document.getElementById("brand-count");
    const brandProductCount = document.getElementById("brand-product-count");
    const brandSelect = document.getElementById("brand-select");
    const productSelect = document.getElementById("product-select");
    const addProductButton = document.getElementById("add-product");
    const fieldList = document.getElementById("field-list");
    const tableRegion = document.getElementById("table-region");
    const counter = document.getElementById("counter");
    const productPalette = ["#59d4ff", "#ffbe55", "#73e2ad", "#c79cff", "#ff8495", "#78a8ff", "#e6dc69", "#65dfd6"];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" })[c]);
    }

    function renderProductList() {
      const brands = [...new Set(products.map(product => product.maker))];
      brandCount.textContent = brands.length;
      brandCount.setAttribute("aria-label", `${brands.length} available brands`);
      if (state.selectedBrand && !brands.includes(state.selectedBrand)) state.selectedBrand = "";
      brandSelect.innerHTML = `<option value="">Select brand…</option>` + brands.map(brand => `<option value="${escapeHtml(brand)}"${brand === state.selectedBrand ? " selected" : ""}>${escapeHtml(brand)}</option>`).join("");
      const brandProducts = products.filter(product => product.maker === state.selectedBrand);
      brandProductCount.textContent = brandProducts.length;
      brandProductCount.setAttribute("aria-label", `${brandProducts.length} products for ${state.selectedBrand || "the selected brand"}`);
      const previousProduct = productSelect.value;
      productSelect.innerHTML = `<option value="">${state.selectedBrand ? "Select product…" : "Choose a brand first"}</option>` + brandProducts.map(product => `<option value="${product.id}">${escapeHtml(product.part)}</option>`).join("");
      productSelect.disabled = !state.selectedBrand;
      if (brandProducts.some(product => product.id === previousProduct)) productSelect.value = previousProduct;
      addProductButton.disabled = !productSelect.value || state.selectedProducts.includes(productSelect.value);
      productList.innerHTML = state.selectedProducts.length ? state.selectedProducts.map(id => {
        const product = products.find(item => item.id === id);
        if (!product) return "";
        const order = state.selectedProducts.indexOf(id) + 1;
        const color = productPalette[(order - 1) % productPalette.length];
        return `<div class="selected-product" draggable="true" data-selected-product="${product.id}" style="--product-color:${color}"><span class="drag-handle" aria-hidden="true">⋮⋮</span><span class="selection-pill" title="Brand"><span class="product-order-badge">${order}</span><span>${escapeHtml(product.maker)}</span></span><span class="selection-pill" title="Product"><span class="product-order-badge">${order}</span><span>${escapeHtml(product.part)}</span></span><button class="remove-product" type="button" data-remove-product="${product.id}" title="Remove ${escapeHtml(product.part)}" aria-label="Remove ${escapeHtml(product.part)}">−</button></div>`;
      }).join("") : `<div class="selected-empty">No products selected. Choose a brand and product above, then press +.</div>`;
    }

    function renderFieldList() {
      const query = state.query.toLowerCase();
      fieldList.innerHTML = rows
        .filter(r => r.label.toLowerCase().includes(query))
        .map(r => `
          <label class="check">
            <input type="checkbox" data-field="${r.id}" ${state.selectedFields.has(r.id) ? "checked" : ""}>
            <span>${escapeHtml(r.label)}</span>
          </label>`).join("");
    }

    function rowClass(label) {
      if (label.endsWith("— Red")) return "row-red";
      if (label.endsWith("— Green")) return "row-green";
      if (label.endsWith("— Blue")) return "row-blue";
      return "";
    }

    function renderTable() {
      const visibleProducts = state.selectedProducts.map(id => products.find(product => product.id === id)).filter(Boolean);
      const visibleRows = rows.filter(r => state.selectedFields.has(r.id) && r.label.toLowerCase().includes(state.query.toLowerCase()));
      counter.textContent = `${visibleProducts.length} products · ${visibleRows.length} fields`;

      // (aside collapse controlled only by the toggle button)

      if (!visibleProducts.length || !visibleRows.length) {
        tableRegion.innerHTML = `<div class="empty">Select at least one product and one comparison field.</div>`;
        return;
      }

      const colCount = visibleProducts.length * (state.mode === "both" ? 2 : 1) + 2;
      let html = `<div class="table-shell"><table style="min-width:${Math.max(900, colCount * 155)}px"><thead><tr><th>Parameter</th>`;
      visibleProducts.forEach((p, productOrder) => {
        const color = productPalette[productOrder % productPalette.length];
        if (state.mode !== "normalized") {
          const isEnd = state.mode === "original";
          html += `<th draggable="true" data-product-column="${p.id}" class="product-column${isEnd ? " product-group-end" : ""}" style="--product-color:${color}"><span class="maker">${escapeHtml(p.maker)}</span><span class="part">${escapeHtml(p.part)}</span><span class="column-kind">Original</span></th>`;
        }
        if (state.mode !== "original") {
          html += `<th draggable="true" data-product-column="${p.id}" class="product-column normalized product-group-end" style="--product-color:${color}"><span class="maker">${escapeHtml(p.maker)}</span><span class="part">${escapeHtml(p.part)}</span><span class="column-kind">Normalized · 3.2 mA</span></th>`;
        }
      });
      html += `<th>Notes</th></tr></thead><tbody>`;

      visibleRows.forEach(row => {
        html += `<tr draggable="true" data-field-row="${row.id}" class="${rowClass(row.label)}"><th scope="row" title="Drag to reorder">${escapeHtml(row.label)}</th>`;
        visibleProducts.forEach((p, productOrder) => {
          const index = products.findIndex(item => item.id === p.id);
          const color = productPalette[productOrder % productPalette.length];
          if (state.mode !== "normalized") html += `<td class="product-cell${state.mode === "original" ? " product-group-end" : ""}" style="--product-color:${color}">${escapeHtml(row.original[index] ?? "")}</td>`;
          if (state.mode !== "original") {
            const normalizedValue = row.normalized[index] !== undefined && row.normalized[index] !== null
              ? row.normalized[index]
              : row.original[index];
            html += `<td class="product-cell normalized product-group-end" style="--product-color:${color}">${escapeHtml(normalizedValue ?? "")}</td>`;
          }
        });
        html += `<td>${escapeHtml(row.notes)}</td></tr>`;
      });
      html += `</tbody></table></div>`;
      tableRegion.innerHTML = html;
      // After inserting the table HTML, attach resizers for columns
      addResizers();
    }

    function render() {
      renderProductList();
      renderFieldList();
      renderTable();
    }

    // Toggle the left filters aside and persist state
    const toggleAsideBtn = document.getElementById("toggle-aside");
    const layoutEl = document.querySelector(".layout");
    const ASIDE_KEY = 'ledcmp_aside_collapsed';
    const COLWIDTH_KEY = 'ledcmp_col_widths';

    function setAsideCollapsed(collapsed, save = true) {
      layoutEl.classList.toggle('aside-collapsed', !!collapsed);
      toggleAsideBtn.textContent = collapsed ? '>>>' : '<<<';
      if (save) localStorage.setItem(ASIDE_KEY, JSON.stringify(!!collapsed));
    }

    // Initialize aside state from localStorage
    try {
      const savedAside = JSON.parse(localStorage.getItem(ASIDE_KEY));
      setAsideCollapsed(!!savedAside, false);
    } catch (e) {
      setAsideCollapsed(false, false);
    }

    toggleAsideBtn.addEventListener('click', () => {
      const collapsed = !layoutEl.classList.contains('aside-collapsed');
      setAsideCollapsed(collapsed, true);
    });

    // Full-page toggle: hide header and aside and expand table to fill viewport
    const toggleFullBtn = document.getElementById('toggle-full');
    const appEl = document.querySelector('.app');
    const FULLPAGE_KEY = 'ledcmp_fullpage';

    function setFullPage(enabled, save = true) {
      appEl.classList.toggle('fullpage', !!enabled);
      toggleFullBtn.textContent = enabled ? 'Restore' : 'Full page';
      if (save) localStorage.setItem(FULLPAGE_KEY, JSON.stringify(!!enabled));
    }

    try {
      const saved = JSON.parse(localStorage.getItem(FULLPAGE_KEY));
      setFullPage(!!saved, false);
    } catch (e) {
      setFullPage(false, false);
    }

    toggleFullBtn.addEventListener('click', () => {
      const isFull = appEl.classList.contains('fullpage');
      setFullPage(!isFull, true);
    });

    // Add column resizers to the table header, persist widths
    function addResizers() {
      const table = tableRegion.querySelector("table");
      if (!table) return;
      // Remove existing resizers
      table.querySelectorAll('.col-resizer').forEach(n => n.remove());
      const headers = table.querySelectorAll('thead th');

      headers.forEach((th, index) => {
        const resizer = document.createElement('div');
        resizer.className = 'col-resizer';
        resizer.tabIndex = 0;
        resizer.setAttribute('role', 'separator');
        resizer.setAttribute('aria-orientation', 'vertical');
        resizer.setAttribute('aria-label', `Resize ${th.innerText.trim() || 'column'}`);
        th.appendChild(resizer);

        let startX;
        let startWidth;
        const applyWidth = (width) => {
          const newWidth = Math.max(index === 0 ? 100 : 64, width);
          Array.from(table.rows).forEach(row => {
            const cell = row.cells[index];
            if (!cell) return;
            cell.style.width = newWidth + 'px';
            cell.style.minWidth = newWidth + 'px';
            cell.style.maxWidth = newWidth + 'px';
          });
        };
        const onPointerMove = (e) => {
          const dx = e.clientX - startX;
          applyWidth(startWidth + dx);
        };
        const onPointerUp = (e) => {
          if (resizer.hasPointerCapture?.(e.pointerId)) resizer.releasePointerCapture(e.pointerId);
          resizer.removeEventListener('pointermove', onPointerMove);
          resizer.removeEventListener('pointerup', onPointerUp);
          resizer.removeEventListener('pointercancel', onPointerUp);
          saveWidths();
        };

        resizer.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          startX = e.clientX;
          startWidth = th.offsetWidth;
          resizer.setPointerCapture?.(e.pointerId);
          resizer.addEventListener('pointermove', onPointerMove);
          resizer.addEventListener('pointerup', onPointerUp);
          resizer.addEventListener('pointercancel', onPointerUp);
        });

        resizer.addEventListener('keydown', (e) => {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          e.preventDefault();
          applyWidth(th.offsetWidth + (e.key === 'ArrowRight' ? 10 : -10));
          saveWidths();
        });
      });

      // Restore previously saved widths (if any)
      restoreWidths();
    }

    function saveWidths() {
      const table = tableRegion.querySelector('table');
      if (!table) return;
      const headers = table.querySelectorAll('thead th');
      const widths = Array.from(headers).map(h => h.offsetWidth);
      try { localStorage.setItem(COLWIDTH_KEY, JSON.stringify(widths)); } catch (e) {}
    }

    function restoreWidths() {
      const table = tableRegion.querySelector('table');
      if (!table) return;
      let widths = null;
      try { widths = JSON.parse(localStorage.getItem(COLWIDTH_KEY)); } catch (e) {}
      if (!Array.isArray(widths)) return;
      const headers = table.querySelectorAll('thead th');
      headers.forEach((h, i) => {
        if (!widths[i]) return;
        Array.from(table.rows).forEach(row => {
          const cell = row.cells[i];
          if (!cell) return;
          cell.style.width = widths[i] + 'px';
          cell.style.minWidth = widths[i] + 'px';
          cell.style.maxWidth = widths[i] + 'px';
        });
      });
    }

    document.addEventListener("change", event => {
      const fieldId = event.target.dataset.field;
      if (fieldId) event.target.checked ? state.selectedFields.add(fieldId) : state.selectedFields.delete(fieldId);
      if (fieldId) saveComparisonState();
      renderTable();
    });

    document.addEventListener("click", event => {
      const action = event.target.dataset.action;
      if (action === "all-products") state.selectedProducts = products.map(product => product.id);
      if (action === "no-products") state.selectedProducts = [];
      if (action === "all-fields") state.selectedFields = new Set(rows.map(r => r.id));
      if (action === "no-fields") state.selectedFields.clear();
      if (action) { saveComparisonState(); render(); }

      const mode = event.target.dataset.mode;
      if (mode) {
        state.mode = mode;
        document.querySelectorAll("[data-mode]").forEach(btn => btn.classList.toggle("active", btn.dataset.mode === mode));
        saveComparisonState();
        renderTable();
      }
    });

    document.getElementById("field-search").addEventListener("input", event => {
      state.query = event.target.value;
      renderFieldList();
      renderTable();
    });

    brandSelect.addEventListener("change", event => { state.selectedBrand = event.target.value; renderProductList(); });
    productSelect.addEventListener("change", () => { addProductButton.disabled = state.selectedProducts.includes(productSelect.value); });
    addProductButton.addEventListener("click", () => {
      const id = productSelect.value;
      if (id && !state.selectedProducts.includes(id)) state.selectedProducts.push(id);
      state.selectedBrand = "";
      saveComparisonState();
      renderProductList();
      renderTable();
    });
    productList.addEventListener("click", event => {
      const id = event.target.closest("[data-remove-product]")?.dataset.removeProduct;
      if (!id) return;
      state.selectedProducts = state.selectedProducts.filter(productId => productId !== id);
      saveComparisonState();
      renderProductList();
      renderTable();
    });
    let draggedProductId = null;
    productList.addEventListener("dragstart", event => {
      const item = event.target.closest("[data-selected-product]");
      if (!item) return;
      draggedProductId = item.dataset.selectedProduct;
      item.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedProductId);
    });
    productList.addEventListener("dragover", event => {
      const item = event.target.closest("[data-selected-product]");
      if (!item || item.dataset.selectedProduct === draggedProductId) return;
      event.preventDefault();
      productList.querySelectorAll(".drag-over").forEach(element => element.classList.remove("drag-over"));
      item.classList.add("drag-over");
    });
    productList.addEventListener("drop", event => {
      const target = event.target.closest("[data-selected-product]");
      if (!target || !draggedProductId || target.dataset.selectedProduct === draggedProductId) return;
      event.preventDefault();
      const from = state.selectedProducts.indexOf(draggedProductId);
      let to = state.selectedProducts.indexOf(target.dataset.selectedProduct);
      const placeAfter = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
      state.selectedProducts.splice(from, 1);
      to = state.selectedProducts.indexOf(target.dataset.selectedProduct) + (placeAfter ? 1 : 0);
      state.selectedProducts.splice(to, 0, draggedProductId);
      saveComparisonState();
      renderProductList();
      renderTable();
    });
    productList.addEventListener("dragend", () => {
      draggedProductId = null;
      productList.querySelectorAll(".dragging,.drag-over").forEach(element => element.classList.remove("dragging", "drag-over"));
    });
    let draggedColumnProductId = null;
    tableRegion.addEventListener("dragstart", event => {
      if (event.target.closest(".col-resizer")) { event.preventDefault(); return; }
      const header = event.target.closest("[data-product-column]");
      if (!header) return;
      draggedColumnProductId = header.dataset.productColumn;
      tableRegion.querySelectorAll(`[data-product-column="${draggedColumnProductId}"]`).forEach(element => element.classList.add("column-dragging"));
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedColumnProductId);
    });
    tableRegion.addEventListener("dragover", event => {
      const target = event.target.closest("[data-product-column]");
      if (!target || target.dataset.productColumn === draggedColumnProductId) return;
      event.preventDefault();
      tableRegion.querySelectorAll(".column-drag-target").forEach(element => element.classList.remove("column-drag-target"));
      tableRegion.querySelectorAll(`[data-product-column="${target.dataset.productColumn}"]`).forEach(element => element.classList.add("column-drag-target"));
    });
    tableRegion.addEventListener("drop", event => {
      const target = event.target.closest("[data-product-column]");
      if (!target || !draggedColumnProductId || target.dataset.productColumn === draggedColumnProductId) return;
      event.preventDefault();
      const from = state.selectedProducts.indexOf(draggedColumnProductId);
      const targetId = target.dataset.productColumn;
      const placeAfter = event.clientX > target.getBoundingClientRect().left + target.offsetWidth / 2;
      state.selectedProducts.splice(from, 1);
      const to = state.selectedProducts.indexOf(targetId) + (placeAfter ? 1 : 0);
      state.selectedProducts.splice(to, 0, draggedColumnProductId);
      draggedColumnProductId = null;
      saveComparisonState();
      renderProductList();
      renderTable();
    });
    tableRegion.addEventListener("dragend", () => {
      draggedColumnProductId = null;
      tableRegion.querySelectorAll(".column-dragging,.column-drag-target").forEach(element => element.classList.remove("column-dragging", "column-drag-target"));
    });
    let draggedFieldId = null;
    tableRegion.addEventListener("dragstart", event => {
      const row = event.target.closest("[data-field-row]");
      if (!row || event.target.closest(".col-resizer")) return;
      draggedFieldId = row.dataset.fieldRow;
      row.classList.add("row-dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedFieldId);
    });
    tableRegion.addEventListener("dragover", event => {
      const row = event.target.closest("[data-field-row]");
      if (!row || row.dataset.fieldRow === draggedFieldId) return;
      event.preventDefault();
      tableRegion.querySelectorAll(".row-drag-target").forEach(element => element.classList.remove("row-drag-target"));
      row.classList.add("row-drag-target");
    });
    tableRegion.addEventListener("drop", event => {
      const target = event.target.closest("[data-field-row]");
      if (!target || !draggedFieldId || target.dataset.fieldRow === draggedFieldId) return;
      event.preventDefault();
      const from = rows.findIndex(row => row.id === draggedFieldId);
      const targetId = target.dataset.fieldRow;
      const placeAfter = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
      const [movedRow] = rows.splice(from, 1);
      const to = rows.findIndex(row => row.id === targetId) + (placeAfter ? 1 : 0);
      rows.splice(to, 0, movedRow);
      draggedFieldId = null;
      saveComparisonState();
      renderFieldList();
      renderTable();
    });
    tableRegion.addEventListener("dragend", () => {
      draggedFieldId = null;
      tableRegion.querySelectorAll(".row-dragging,.row-drag-target").forEach(element => element.classList.remove("row-dragging", "row-drag-target"));
    });

    document.getElementById("copy-button").addEventListener("click", async event => {
      const table = tableRegion.querySelector("table");
      if (!table) return;
      const text = [...table.rows].map(row => [...row.cells].map(cell => cell.innerText.replace(/\n/g, " ")).join("\t")).join("\n");
      await navigator.clipboard.writeText(text);
      const old = event.target.textContent;
      event.target.textContent = "Copied";
      setTimeout(() => event.target.textContent = old, 1200);
    });

    document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("active", button.dataset.mode === state.mode));
    render();
  </script>
</body>
</html>
