<body><main class="wrap"><header class="top"><img class="logo" src="company-logo.png" alt="ClearLED"><div class="actions"><a href="applications.html">⌂ Home</a><button id="signout">Sign out</button></div></header><section class="hero"><small>Engineering master data</small><h1>IC & PSU Database</h1><p>Controlled component records for sales specifications, reports, and future job projects. Everyone can read; administrators maintain records.</p></section><p id="message" class="status">Loading records…</p><nav class="tabs"><button class="tab active" data-tab="ics">IC Database</button><button class="tab" data-tab="psus">PSU Database</button></nav>
