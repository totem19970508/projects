<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parts & Equipment Database · ClearLED</title>
  <script>if(sessionStorage.getItem("clearled_authenticated")!=="true"&&localStorage.getItem("clearled_authenticated")!=="true")location.replace("index.html")</script>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:#102235;--surface:#071521;--line:#294a64;--field-line:#3b6c8b;--text:#edf7fc;--muted:#96adbf;--cyan:#4bd4e8;--green:#5cdda0;--red:#ff8294}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0,#123d55,transparent 34rem),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 36px));margin:auto;padding:24px 0 60px}.top,.actions,.toolbar,.panel-head,.tabs{display:flex;align-items:center;gap:9px}.top,.panel-head{justify-content:space-between}.logo{height:42px;padding:6px;background:#fff;border-radius:8px}a,button{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#132a3e;color:var(--text);font:inherit;text-decoration:none;cursor:pointer}.hero{padding:42px 0 22px}.hero small{color:var(--cyan);font-weight:850;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:6px 0;font-size:clamp(32px,5vw,46px)}.hero p,.muted,#message{color:var(--muted)}.tabs{margin-bottom:12px}.tab.active{border-color:var(--cyan);background:var(--cyan);color:#04151c;font-weight:850}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#11283c,var(--panel));overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:17px}.toolbar{flex-wrap:wrap;padding:13px 17px;border-bottom:1px solid var(--line)}select,input,textarea{min-width:0;min-height:40px;padding:8px 10px;border:2px solid var(--field-line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}.toolbar select{width:190px}.toolbar input{width:min(320px,100%)}.count{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border:1px solid #3c7694;border-radius:999px;background:#123b51;color:var(--cyan);font-size:11px;font-weight:900}.table-wrap{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);background:#081825;font-size:10px;letter-spacing:.06em;text-transform:uppercase}tbody tr:nth-child(even){background:#0c2233}.code{color:var(--cyan);font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#16493d;color:#b4f3d6;font-size:10px}.inactive{background:#49212a;color:#ffd2d9}.danger{border-color:#70414b;background:#351923;color:#ffd7dc}.empty{padding:34px;color:var(--muted);text-align:center}.editor{display:none;margin:14px 17px 17px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#071722}.editor.show{display:block}.editor h3{margin:0 0 13px}.form-grid,.spec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}label{min-width:0;color:var(--muted);font-size:11px;font-weight:800}label input,label select,label textarea{width:100%;margin-top:5px}.wide{grid-column:1/-1}.spec-block{grid-column:1/-1;padding-top:4px}.spec-block h4{margin:0 0 8px;color:var(--cyan)}textarea{height:64px;resize:vertical}.check{display:flex;align-items:center;gap:8px;align-self:end;min-height:40px}.check input{width:auto;min-height:0;margin:0}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.pdf-link{color:var(--cyan)}@media(max-width:800px){.form-grid,.spec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{width:calc(100% - 22px)}.top{align-items:flex-start}.form-grid,.spec-grid{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar>*{width:100%!important}.panel-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><img class="logo" src="company-logo.png" alt="ClearLED"><div class="actions"><a href="applications.html">⌂ Home</a><button type="button" id="signout">Sign out</button></div></header>
  <section class="hero"><small>Engineering master data</small><h1>Parts & Equipment Database</h1><p>One controlled parts catalogue and one equipment catalogue. Administrators maintain records; authorized users can search and read them.</p></section>
  <p id="message">Loading catalogues…</p>
  <nav class="tabs" aria-label="Catalogues"><button type="button" class="tab active" data-catalog="parts">Parts</button><button type="button" class="tab" data-catalog="equipment">Equipment</button></nav>
  <section class="card">
    <div class="panel-head"><h2 id="catalogTitle">Parts catalogue</h2><div class="actions"><span id="recordCount" class="count">0</span><button type="button" id="newRecord" class="admin-only" hidden>+ New record</button></div></div>
    <div class="toolbar"><select id="typeFilter" aria-label="Item type"></select><input id="catalogSearch" type="search" placeholder="Search brand, part or model"><button type="button" id="refresh">Refresh</button></div>
    <form id="recordForm" class="editor admin-only" hidden>
      <h3 id="editorTitle">New record</h3>
      <div class="form-grid">
        <label>Record No.<input name="recordNo" placeholder="Created automatically" readonly></label>
        <label>Type<select name="type"></select></label>
        <label>Brand<input name="brand" required></label>
        <label id="codeLabel">Part No.<input name="catalogCode" required></label>
        <label class="wide">Description<input name="description"></label>
        <section class="spec-block"><h4>Specifications</h4><div id="specFields" class="spec-grid"></div></section>
        <label class="wide">Remarks<textarea name="remarks"></textarea></label>
        <label>PDF datasheet<input name="datasheetFile" type="file" accept="application/pdf,.pdf"></label>
        <label class="check"><input name="active" type="checkbox" checked> Active record</label>
      </div>
      <div class="form-actions"><button id="cancelEdit" type="button">Cancel</button><button type="submit">Save record</button></div>
    </form>
    <div id="catalogTable" class="table-wrap"></div>
  </section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{collection,deleteDoc,doc,getDoc,getDocs,getFirestore,limit,query,serverTimestamp,updateDoc,where}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import{deleteObject,getDownloadURL,getStorage,ref,uploadBytes}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";
import{CATALOG_TYPES,catalogCode,createCatalogRecord,ensureCatalogData,normalizeCatalogSearch,prepareCatalogRecord,registerCatalogBrand}from"./catalog-data.js";
const SUPERUSER_EMAIL="totem1997@gmail.com";
const config={apiKey:"AIzaSyAmPf0yWWQI35pNGX1FcsVZJhd3ADMhY78",authDomain:"led-db-465b0.firebaseapp.com",projectId:"led-db-465b0",storageBucket:"led-db-465b0.firebasestorage.app",messagingSenderId:"922283607413",appId:"1:922283607413:web:f58b3e9ebd507082b03f3c"},app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const message=document.getElementById("message"),catalogTitle=document.getElementById("catalogTitle"),recordCount=document.getElementById("recordCount"),typeFilter=document.getElementById("typeFilter"),search=document.getElementById("catalogSearch"),table=document.getElementById("catalogTable"),form=document.getElementById("recordForm"),typeInput=form.elements.type,codeLabel=document.getElementById("codeLabel"),specFields=document.getElementById("specFields");let admin=false,currentCatalog="parts",records=[],editing=null,searchTimer=null,capabilities={r:false,c:false,u:false,d:false};
function normalizeCrudPermission(raw){if(raw&&typeof raw==="object")return{c:raw.c===true,r:raw.r===true,u:raw.u===true,d:raw.d===true};if(raw===true)return{c:true,r:true,u:true,d:true};return{c:false,r:false,u:false,d:false}}
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]),title=value=>String(value).replace(/([A-Z])/g," $1").replace(/^./,char=>char.toUpperCase()),definition=()=>CATALOG_TYPES[currentCatalog][typeInput.value];
function populateTypes(){const types=Object.keys(CATALOG_TYPES[currentCatalog]);typeFilter.replaceChildren(...types.map(type=>new Option(type,type)));typeInput.replaceChildren(...types.map(type=>new Option(type,type)));catalogTitle.textContent=currentCatalog==="parts"?"Parts catalogue":"Equipment catalogue";renderSpecFields()}
function renderSpecFields(values={}){const config=definition();codeLabel.childNodes[0].textContent=config.codeLabel;specFields.innerHTML=config.specs.map(field=>`<label>${esc(title(field))}<input name="spec_${esc(field)}" value="${esc(values[field]??"")}"></label>`).join("")}
function openEditor(record=null){editing=record;form.reset();typeInput.disabled=Boolean(record);typeInput.value=record?.type||typeFilter.value;form.elements.recordNo.value=record?.recordNo||"";form.elements.brand.value=record?.brand||"";form.elements.catalogCode.value=catalogCode(record)||"";form.elements.description.value=record?.description||"";form.elements.remarks.value=record?.remarks||"";form.elements.active.checked=record?.active!==false;renderSpecFields(record?.specs||{});document.getElementById("editorTitle").textContent=record?`Edit ${record.recordNo}`:"New record";form.hidden=false;form.classList.add("show");form.elements.brand.focus()}
function closeEditor(){editing=null;typeInput.disabled=false;form.classList.remove("show");form.hidden=true;form.reset()}
function render(){const canEdit=capabilities.u,canDelete=capabilities.d,showActions=canEdit||canDelete;recordCount.textContent=String(records.length);recordCount.setAttribute("aria-label",`${records.length} records shown`);table.innerHTML=records.length?`<table><thead><tr><th>Record No.</th><th>Type</th><th>Brand</th><th>Part / Model</th><th>Description</th><th>Status</th><th>Datasheet</th>${showActions?"<th>Actions</th>":""}</tr></thead><tbody>${records.map(record=>`<tr data-id="${esc(record.id)}"><td class="code">${esc(record.recordNo)}</td><td>${esc(record.type)}</td><td>${esc(record.brand)}</td><td>${esc(catalogCode(record))}</td><td>${esc(record.description)}</td><td><span class="pill ${record.active===false?"inactive":""}">${record.active===false?"Inactive":"Active"}</span></td><td>${record.datasheetUrl?`<a class="pdf-link" href="${esc(record.datasheetUrl)}" target="_blank" rel="noopener">Open PDF</a>`:"—"}</td>${showActions?`<td>${canEdit?`<button type="button" data-edit="${esc(record.id)}">Edit</button>`:""} ${canDelete?`<button type="button" class="danger" data-delete="${esc(record.id)}">Delete</button>`:""}</td>`:""}</tr>`).join("")}</tbody></table>`:'<div class="empty">No matching records.</div>'}
async function loadRecords(){message.textContent="Loading records…";const type=typeFilter.value,term=normalizeCatalogSearch(search.value),constraints=[where("type","==",type)];if(term.length>=2)constraints.push(where("searchTokens","array-contains",term));constraints.push(limit(100));try{const snapshot=await getDocs(query(collection(db,currentCatalog),...constraints));records=snapshot.docs.map(item=>({id:item.id,...item.data()})).sort((a,b)=>String(a.brand||"").localeCompare(String(b.brand||""))||String(catalogCode(a)).localeCompare(String(catalogCode(b))));render();message.textContent=`Showing ${records.length} ${type} record${records.length===1?"":"s"}${records.length===100?". Refine the search to see more.":"."}`}catch(error){console.error(error);records=[];render();message.textContent=`Could not load catalogue: ${error.code||error.message}. Deploy the updated Firestore rules and indexes.`}}
document.querySelectorAll("[data-catalog]").forEach(button=>button.onclick=()=>{currentCatalog=button.dataset.catalog;document.querySelectorAll("[data-catalog]").forEach(item=>item.classList.toggle("active",item===button));closeEditor();populateTypes();search.value="";loadRecords()});
typeFilter.onchange=()=>{closeEditor();typeInput.value=typeFilter.value;renderSpecFields();loadRecords()};typeInput.onchange=()=>renderSpecFields();search.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadRecords,250)};document.getElementById("refresh").onclick=loadRecords;document.getElementById("newRecord").onclick=()=>openEditor();document.getElementById("cancelEdit").onclick=closeEditor;
table.onclick=async event=>{const editButton=event.target.closest("[data-edit]"),deleteButton=event.target.closest("[data-delete]");if(editButton){if(!capabilities.u)return;const record=records.find(item=>item.id===editButton.dataset.edit);if(record)openEditor(record)}if(deleteButton){if(!capabilities.d)return;const record=records.find(item=>item.id===deleteButton.dataset.delete);if(!record||!confirm(`Delete ${record.recordNo}?`))return;try{if(record.datasheetPath)await deleteObject(ref(storage,record.datasheetPath)).catch(()=>{});await deleteDoc(doc(db,currentCatalog,record.id));message.textContent=`${record.recordNo} deleted.`;await loadRecords()}catch(error){message.textContent=`Could not delete record: ${error.code||error.message}`}}};
form.onsubmit=async event=>{event.preventDefault();const isUpdate=Boolean(editing);if((isUpdate&&!capabilities.u)||(!isUpdate&&!capabilities.c)||!form.reportValidity())return;const config=definition(),specs=Object.fromEntries(config.specs.map(field=>[field,form.elements[`spec_${field}`].value.trim()]).filter(([,value])=>value!=="")),base={brand:form.elements.brand.value.trim(),description:form.elements.description.value.trim(),remarks:form.elements.remarks.value.trim(),active:form.elements.active.checked,specs};base[config.codeField]=form.elements.catalogCode.value.trim();const file=form.elements.datasheetFile.files[0],button=form.querySelector('[type="submit"]');button.disabled=true;try{let saved;if(editing){const{id,...stored}=editing,prepared=prepareCatalogRecord({...stored,...base,type:typeInput.value,updatedAt:serverTimestamp()});await updateDoc(doc(db,currentCatalog,id),prepared);saved={id,...prepared}}else saved=await createCatalogRecord(db,currentCatalog,typeInput.value,base);await registerCatalogBrand(db,currentCatalog,typeInput.value,base.brand);if(file){const path=`catalog-datasheets/${currentCatalog}/${saved.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`,storageRef=ref(storage,path);await uploadBytes(storageRef,file,{contentType:"application/pdf"});const url=await getDownloadURL(storageRef);if(saved.datasheetPath)deleteObject(ref(storage,saved.datasheetPath)).catch(()=>{});await updateDoc(doc(db,currentCatalog,saved.id),{datasheetName:file.name,datasheetPath:path,datasheetUrl:url,updatedAt:serverTimestamp()})}message.textContent=`${saved.recordNo} saved.`;typeFilter.value=typeInput.value;closeEditor();await loadRecords()}catch(error){console.error(error);message.textContent=`Could not save record: ${error.code||error.message}`}finally{button.disabled=false}};
onAuthStateChanged(auth,async user=>{if(!user)return location.replace("index.html");const profile=await getDoc(doc(db,"users",user.uid)),profileData=profile.exists()?profile.data():{},role=String(profileData.role||"").toLowerCase(),email=String(profileData.email||user.email||"").toLowerCase(),isPrivileged=role==="admin"||role==="superuser"||email===SUPERUSER_EMAIL;capabilities=isPrivileged?{c:true,r:true,u:true,d:true}:normalizeCrudPermission(profileData.permissions?.components);if(!capabilities.r)return location.replace("applications.html?access=denied");admin=capabilities.c||capabilities.u||capabilities.d;document.querySelectorAll(".admin-only").forEach(element=>element.hidden=!(capabilities.c||capabilities.u));document.getElementById("newRecord").hidden=!capabilities.c;populateTypes();if(admin){try{const result=await ensureCatalogData(db);message.textContent=`Catalogues ready. ${Object.keys(result.counts||{}).length||8} item types checked.`}catch(error){console.error(error);message.textContent=`Catalog migration is waiting for the updated Firestore rules: ${error.code||error.message}`}}await loadRecords()});
document.getElementById("signout").onclick=async()=>{await signOut(auth);sessionStorage.clear();localStorage.removeItem("clearled_authenticated");location.replace("index.html")};
</script>
</body>
</html>
